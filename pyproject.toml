[project]
name = "ae-control-mcp"
version = "0.1.0"
description = "MCP server for GUI mouse/keyboard control and Adobe After Effects 2020 automation"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0,<2.0.0",
    "mss>=9.0.1",
    "pillow>=10.0.0",
    "pyautogui>=0.9.54",
    "pygetwindow>=0.0.9",
]

[project.scripts]
ae-control-mcp = "ae_control_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ae_control_mcp"]
